[workspace]
resolver = "2"
members = [
    "abi",
    "arch/x86_64",
    "compiler",
    "ext2w",
    "interpreter",
    "kernel",
    "langhost",
    "net",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2021"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = true
